<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
    <linearGradient id="chem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#86efac"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <!-- flask/container -->
  <g transform="translate(200,175)">
    <!-- bottle -->
    <path d="M-40,60 L-30,-40 L-20,-70 L20,-70 L30,-40 L40,60 Z" fill="none" stroke="url(#chem)" stroke-width="4" opacity="0.8"/>
    <!-- liquid -->
    <path d="M-38,45 L-31,-35 C-30,-40 30,-40 31,-35 L38,45 Z" fill="url(#chem)" opacity="0.35"/>
    <!-- bubbles -->
    <circle cx="-10" cy="20" r="5" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.6"/>
    <circle cx="15" cy="5" r="3" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.5"/>
    <circle cx="-5" cy="-15" r="4" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.5"/>
    <!-- cap -->
    <rect x="-22" y="-78" width="44" height="12" rx="3" fill="url(#chem)" opacity="0.5"/>
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="18" font-weight="600">化工原料</text>
</svg>
