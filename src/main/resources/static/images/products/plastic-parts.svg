<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1d96"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="50%" style="stop-color:#ede9fe"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- molded part -->
  <g transform="translate(200,190)">
    <path d="M-80,-50 L-40,-80 L50,-70 L90,-20 L80,40 L30,70 L-50,60 L-85,20 Z" fill="url(#plastic)" stroke="#7c3aed" stroke-width="3" opacity="0.9"/>
    <path d="M-50,-20 L-20,-40 L30,-35 L55,-5 L50,25 L20,45 L-25,38 L-52,10 Z" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
    <!-- mold lines -->
    <line x1="-65" y1="-10" x2="70" y2="0" stroke="white" stroke-width="1" opacity="0.3"/>
    <circle cx="10" cy="-10" r="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="18" font-weight="600">塑胶模具</text>
</svg>
