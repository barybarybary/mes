<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="100%" style="stop-color:#164e63"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg3)"/>
  <!-- chip/PCB -->
  <g transform="translate(200,180)">
    <rect x="-100" y="-70" width="200" height="140" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <!-- chip pins -->
    <g stroke="#22d3ee" stroke-width="2.5" opacity="0.8">
      <line x1="-80" y1="-70" x2="-80" y2="-95"/>
      <line x1="-50" y1="-70" x2="-50" y2="-95"/>
      <line x1="-20" y1="-70" x2="-20" y2="-95"/>
      <line x1="10" y1="-70" x2="10" y2="-95"/>
      <line x1="40" y1="-70" x2="40" y2="-95"/>
      <line x1="70" y1="-70" x2="70" y2="-95"/>
      <line x1="-80" y1="70" x2="-80" y2="95"/>
      <line x1="-50" y1="70" x2="-50" y2="95"/>
      <line x1="-20" y1="70" x2="-20" y2="95"/>
      <line x1="10" y1="70" x2="10" y2="95"/>
      <line x1="40" y1="70" x2="40" y2="95"/>
      <line x1="70" y1="70" x2="70" y2="95"/>
    </g>
    <!-- inner chip -->
    <rect x="-60" y="-40" width="120" height="80" rx="6" fill="#164e63" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <!-- traces -->
    <line x1="-90" y1="-30" x2="-65" y2="-30" stroke="#22d3ee" stroke-width="1.2" opacity="0.4"/>
    <line x1="65" y1="-30" x2="90" y2="-30" stroke="#22d3ee" stroke-width="1.2" opacity="0.4"/>
    <line x1="-90" y1="30" x2="-65" y2="30" stroke="#22d3ee" stroke-width="1.2" opacity="0.4"/>
    <line x1="65" y1="30" x2="90" y2="30" stroke="#22d3ee" stroke-width="1.2" opacity="0.4"/>
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="18" font-weight="600">电子元件</text>
</svg>
