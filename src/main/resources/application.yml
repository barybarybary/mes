server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ZaoYi

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mes1?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MES_DB_USERNAME:root}
    # ⚠️ 生产环境务必通过环境变量 MES_DB_PASSWORD 覆盖默认密码
    password: ${MES_DB_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: ${MES_RABBITMQ_USERNAME:mes1}
    password: ${MES_RABBITMQ_PASSWORD:mes1pass}
    virtual-host: /
    # 连接超时 — 避免 RabbitMQ 不可用时阻塞启动
    connection-timeout: 3000
    # 发布端确认（可靠投递）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 消费端手动确认
    listener:
      simple:
        auto-startup: ${MES_RABBITMQ_ENABLED:true}
        acknowledge-mode: manual
        prefetch: 5
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  mail:
    host: smtp.163.com
    port: 465
    username: ${MES_MAIL_USERNAME:}
    password: ${MES_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.itheima.mes1.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 生产环境已关闭SQL日志
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j API 文档（生产环境默认关闭，本地调试设置 KNIFE4J_ENABLE=true）
knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

# Spring Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false   # 邮件未配置时关闭，否则健康检查会报错

# 日志配置
logging:
  level:
    root: WARN
    com.itheima.mes1: INFO
  file:
    name: logs/mes1.log
    max-size: 100MB
    max-history: 30

langchain4j:
  openai:
    api-key: ${DEEPSEEK_API_KEY:}
    model-name: deepseek-chat
    base-url: https://api.deepseek.com
    temperature: 0.7
