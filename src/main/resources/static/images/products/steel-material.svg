<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="50%" style="stop-color:#cbd5e1"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- steel coil/plate -->
  <g transform="translate(200,200)">
    <ellipse cx="0" cy="0" rx="100" ry="100" fill="none" stroke="url(#shine)" stroke-width="12" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="70" ry="70" fill="none" stroke="url(#shine)" stroke-width="8" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="40" ry="40" fill="none" stroke="url(#shine)" stroke-width="6" opacity="0.5"/>
    <circle cx="0" cy="0" r="14" fill="#cbd5e1" opacity="0.8"/>
    <!-- shine line -->
    <line x1="-85" y1="-85" x2="85" y2="85" stroke="white" stroke-width="2" opacity="0.3"/>
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="600">原材料</text>
</svg>
