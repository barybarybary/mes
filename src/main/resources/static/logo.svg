<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.2"/>

  <!-- Gear teeth (simplified) -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#g)" stroke-width="18" stroke-dasharray="12 10" opacity="0.35"/>

  <!-- Inner gear circle -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- Center solid -->
  <circle cx="100" cy="100" r="32" fill="url(#g)" filter="url(#shadow)"/>

  <!-- Cloud shape inside center (made of circles) -->
  <circle cx="85" cy="100" r="12" fill="white" opacity="0.95"/>
  <circle cx="100" cy="92" r="15" fill="white" opacity="0.95"/>
  <circle cx="115" cy="98" r="13" fill="white" opacity="0.95"/>
  <rect x="85" y="97" width="30" height="15" rx="3" fill="white" opacity="0.95"/>

  <!-- Small accent dots -->
  <circle cx="50" cy="55" r="4" fill="url(#g2)"/>
  <circle cx="155" cy="55" r="4" fill="url(#g2)"/>
  <circle cx="50" cy="150" r="4" fill="url(#g2)"/>
  <circle cx="155" cy="145" r="4" fill="url(#g2)"/>

  <!-- Connecting lines -->
  <line x1="100" y1="30" x2="100" y2="55" stroke="url(#g)" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="145" x2="100" y2="170" stroke="url(#g)" stroke-width="2" opacity="0.4"/>
  <line x1="30" y1="100" x2="55" y2="100" stroke="url(#g)" stroke-width="2" opacity="0.4"/>
  <line x1="145" y1="100" x2="170" y2="100" stroke="url(#g)" stroke-width="2" opacity="0.4"/>

  <!-- Text: SmartMfg -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" letter-spacing="1">SmartMfg Cloud</text>
</svg>
