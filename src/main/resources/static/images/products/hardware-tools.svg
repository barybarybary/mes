<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12"/>
      <stop offset="100%" style="stop-color:#9a3412"/>
    </linearGradient>
    <linearGradient id="tool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fed7aa"/>
      <stop offset="50%" style="stop-color:#ffedd5"/>
      <stop offset="100%" style="stop-color:#fdba74"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg6)"/>
  <!-- wrench + bolt -->
  <g transform="translate(200,185)">
    <!-- bolt body -->
    <rect x="-20" y="-40" width="40" height="80" rx="6" fill="url(#tool)" stroke="#c2410c" stroke-width="2.5"/>
    <!-- bolt head -->
    <path d="M-32,-40 L-32,-70 L32,-70 L32,-40" fill="url(#tool)" stroke="#c2410c" stroke-width="2.5"/>
    <!-- bolt threads -->
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#c2410c" stroke-width="1.2" opacity="0.4"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#c2410c" stroke-width="1.2" opacity="0.4"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#c2410c" stroke-width="1.2" opacity="0.4"/>
    <!-- nut on side -->
    <path d="M45,-10 L55,-25 L70,-25 L80,-10 L70,5 L55,5 Z" fill="url(#tool)" stroke="#c2410c" stroke-width="2" opacity="0.8"/>
    <circle cx="62.5" cy="-10" r="8" fill="#7c2d12" opacity="0.5"/>
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="18" font-weight="600">五金工具</text>
</svg>
